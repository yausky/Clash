mode: rule
port: 7890 
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895
allow-lan: true
ipv6: true
log-level: info
external-controller: "0.0.0.0:9090"
secret: ""

profile:
  store-selected: true
  store-fake-ip: true

ntp:
  enable: true
  write-to-system: false
  server: "time.apple.com"
  benchmark-url: "https://www.apple.com/library/test/success.html"
  benchmark-timeout: 5
  port: 123

tun:
  enable: true
  stack: gvisor
  device: utun
  endpoint-independent-nat: true
  auto-route: false
  auto-detect-interface: false
  auto-redirect: false
  strict-route: false

dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.20.0.1/16
  nameserver:
    - 223.5.5.5
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - +.lan
    - +.local
    - geosite:cn
    - +.ths1f9qf.xyz
    - +.speedpie.net
    - +.alibabacloudlnk.help


# 机场节点订阅  
proxy-providers:

#循环
  Cloudflare:
    url: "https://link.yausky.com/cf"
    type: http
    interval: 86400
    path: ./proxy-providers/Cloudflare.yaml
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 1800
    proxy: DIRECT

  ICE:
    url: "https://link.yausky.com/by"
    type: http
    interval: 86400
    path: ./providers/ICE.yaml
    health-check:
      enable: true
      url: http://cp.cloudflare.com/generate_204
      interval: 300
    proxy: 直连

  CordCloud:
    url: "https://link.yausky.com/cordcloud"
    type: http
    interval: 86400
    path: ./proxy-providers/CordCloud.yaml
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 1800
    proxy: DIRECT

  NB:
    url: "https://link.yausky.com/nb"
    type: http
    interval: 86400
    path: ./proxy-providers/牛逼.yaml
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 1800
    proxy: DIRECT


proxies:
  - {name: 直连, type: direct}
  - {name: 拒绝, type: reject}

  #回家
  # - name: 🏠Home                  # 落地节点命名
  #   type: ss                      # 节点协议
  #   server: xxxx.xxxxxxx.com      # 住宅地址
  #   port: xxxxx                   # 端口号
  #   cipher: aes-256-gcm           # 加密方式
  #   password: xxxxxxxxxxxxxxx     # 密码
  #   udp: true                     # udp转发
  

  #链式代理信息
  - name: 链式-美国-住宅ISP         # 落地节点命名
    type: socks5                    # 节点协议
    server: 45.147.159.155          # 住宅IP 代理地址
    port: 45089                     # 端口号
    username: pNQiKK1vMJBZfpZ       # 用户名
    password: eN6wJhuHbf9doTK       # 密码
    udp: true                       # udp转发
    dialer-proxy: 香港-链式前置     # 指定前置代理节点组


